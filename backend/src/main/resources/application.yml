spring:
  application:
    name: devops-classroom-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devops_classroom}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For

jwt:
  secret: ${JWT_SECRET:devopsClassroomSecretKeyForJWTTokenGenerationMustBeLongEnough2024}
  expiration: ${JWT_EXPIRATION:86400000}

langchain4j:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${OLLAMA_MODEL:phi3:latest}
    timeout: ${OLLAMA_TIMEOUT:PT180S}

pgvector:
  host: ${PGVECTOR_HOST:localhost}
  port: ${PGVECTOR_PORT:5432}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

upload:
  directory: ${UPLOAD_DIRECTORY:./uploads/}